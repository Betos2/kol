[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "OPENAI_API_KEY"
  SECRETS_SCAN_OMIT_PATHS = "index.html,README.md"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200
